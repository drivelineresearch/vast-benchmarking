name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Scan tracked files for secrets and personal paths
        run: python scripts/check_public_release.py
